version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Majors are migrations; bump them by hand. update-types only filters
      # version updates, so this never blocks a security update.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Keep inside the ranges pinned by pnpm.overrides in the root package.json.
      - dependency-name: lodash
        versions: [">=5.0.0"]
      - dependency-name: nanoid
        versions: [">=4.0.0"]
      - dependency-name: postcss
        versions: [">=9.0.0"]
      - dependency-name: sharp
        versions: [">=0.36.0"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
